name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pydantic pydantic-settings ragas bentoml
          pip install -e .

      - name: Lint code
        run: |
          ruff check src/ tests/

      - name: Run tests & RAGAS evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: "dummy_public_key"
          LANGFUSE_SECRET_KEY: "dummy_secret_key"

        run: |
          pytest tests/ -v

      - name: pull Vector Index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          dvc pull

      - name: Build Docker Image
        run: |
          bentoml build
          bentoml containerize legal_rag_service:latest